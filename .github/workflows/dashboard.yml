name: 每日看板

on:
  schedule:
    # 主触发是外部准点 cron（cron-job.org）调 workflow_dispatch：23:07 / 00:07 UTC
    # （北京 07:07 / 08:07）。GitHub 自带 schedule 在这个仓库上稳定延迟 4.5–5.5 小时，
    # 靠它赶不上北京早上 9 点，只留作外部触发挂掉时的兜底。
    #
    # 22:07 UTC：美股收盘后 1–2 小时（EDT 20:00 / EST 21:00 收盘），周一至周五
    # 00:07 UTC：已跨过 UTC 零点，对应美东周一至周五收盘，所以星期写 2-6
    # 错开整点几分钟：GitHub 官方文档提示整点是 Actions 调度高峰，容易被限流/跳过
    #
    # 多次触发不会重复跑：下面"检查是否已发布"一步发现 docs 已经是最新一个已收盘
    # 交易日的数据就直接跳过。`jta dashboard` 只要有一个标的没拿到最新数据就失败、
    # 不发布（见 jta/dashboard.py 的 require_fresh），数据源批处理没跑完时靠后面
    # 的触发点隔一段时间整个重跑；都不新鲜会让 run 失败，owner 收到 GitHub 失败通知。
    - cron: "7 22 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch:          # 也可手动触发
    inputs:
      force:
        description: "无视「已发布」检查强制重跑（如改了关注列表）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 检查是否已发布
        id: check
        # 复用 data_age_sessions 的口径：docs/index.html 里所有标的的数据日期
        # 都已是最新一个已收盘交易日，就说明本轮已经发布过，后续触发直接跳过
        run: |
          python - <<'PY'
          import json, os, re, pathlib
          import pandas as pd
          from jta.data.provider import data_age_sessions
          skip = False
          p = pathlib.Path("docs/index.html")
          if p.exists():
              m = re.search(r'"data_dates":\s*(\[[^\]]*\])', p.read_text(encoding="utf-8"))
              dates = json.loads(m.group(1)) if m else []
              if dates:
                  last = pd.Timestamp(min(dates), tz="America/New_York")
                  skip = data_age_sessions(last) == 0
                  print(f"已发布数据日期 {dates}，age_sessions={data_age_sessions(last)}")
          print("已是最新，跳过" if skip else "需要生成")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: 生成看板
        id: build
        if: steps.check.outputs.skip != 'true' || inputs.force
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        # --source auto：yfinance 优先，滞后或失败时切到 twelvedata（未设置 key 时静默退化为纯 yfinance）
        #
        # 不在这一步里重试：twelvedata 免费版限速 8 次/分钟，一次批跑几十个标的
        # 本身就要跑好几分钟（TwelveDataProvider 内建节流），同一个 job 里再重试
        # 三次很容易顶到 20 分钟的 job 超时。失败了就失败，交给上面三个间隔
        # 1 小时的定时点重试——那才是数据源批处理没跑完时真正有用的等待方式。
        run: |
          python -m jta.cli dashboard \
              MU:SOXX SNDK:SOXX SKHY:SOXX WDC:SOXX AVGO:SOXX AMD:SOXX INTC:SOXX \
              LITE:SOXX COHR:SOXX DELL:QQQ AMZN:QQQ GOOGL:QQQ NOW:QQQ NET:QQQ NBIS:QQQ \
              TSLA:QQQ SPCX:QQQ SOXX:QQQ QQQ:SPY DRAM:SOXX MRNA \
              --out-dir docs && echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 提交产物
        if: always() && steps.build.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "看板更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
