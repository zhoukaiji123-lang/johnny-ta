name: 每日看板

on:
  schedule:
    # 01:07 UTC ≈ 北京时间早上 9 点（收盘后 5 小时缓冲），周一至周五
    # 错开整点几分钟：GitHub 官方文档提示整点是 Actions 调度高峰，容易被限流/跳过
    #
    # 三个定时点间隔 1 小时：`jta dashboard` 只要有一个标的没拿到最新已收盘
    # 交易日的数据就直接失败、不发布（见 jta/dashboard.py 的 require_fresh），
    # 这不是网络抖动能靠立即重试解决的，是数据源那边批处理没跑完，所以用
    # "隔一小时再整个跑一遍"而不是在同一个 job 里死等几小时。三次都不新鲜，
    # 会让最后一次 run 失败，仓库 owner 会收到 GitHub 的失败通知去人工看一眼。
    - cron: "7 1 * * 1-5"
    - cron: "7 2 * * 1-5"
    - cron: "7 3 * * 1-5"
  workflow_dispatch:          # 也可手动触发

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 生成看板
        id: build
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        # 无人值守时网络抖动是常态，重试三次；仍失败则让步骤失败并保留上次产物
        # --source auto：yfinance 优先，滞后或失败时切到 twelvedata（未设置 key 时静默退化为纯 yfinance）
        run: |
          for attempt in 1 2 3; do
            echo "第 $attempt 次尝试"
            if python -m jta.cli dashboard \
                MU:SOXX SNDK:SOXX SKHY:SOXX AVGO:SOXX AMD:SOXX INTC:SOXX \
                LITE:SOXX COHR:SOXX DELL:QQQ AMZN:QQQ GOOGL:QQQ NOW:QQQ NET:QQQ \
                TSLA:QQQ SPCX:QQQ SOXX:QQQ QQQ:SPY DRAM:SOXX \
                --out-dir docs; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "失败，等待后重试"
            sleep 60
          done
          echo "三次均失败" >&2
          exit 1

      - name: 提交产物
        if: always() && steps.build.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "看板更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
