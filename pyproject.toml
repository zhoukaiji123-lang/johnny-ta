[project]
name = "johnny-ta"
version = "0.1.0"
description = "Deterministic technical-analysis compute layer for the Johnny analysis skill"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.60",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jta = "jta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jta"]
