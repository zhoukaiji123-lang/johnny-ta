<style>
:root {
  --ground:#F7F8F6; --surface:#FFFFFF; --sunk:#EFF1EE;
  --ink:#1A2126; --ink-soft:#4A555C; --muted:#7E8C93;
  --rule:#D9DEDA; --rule-faint:#E7EBE7;
  --accent:#3A6C8C; --accent-soft:#E2ECF2;
  --good:#3F7A5E; --good-soft:#E3EFE8;
  --bad:#A3462F; --bad-soft:#F6E5E0;
  --warn:#96702A; --warn-soft:#F6EEDC;
  --font-ui:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1418; --surface:#151D22; --sunk:#111920;
  --ink:#DDE4E7; --ink-soft:#A9B5BB; --muted:#78868D;
  --rule:#26323A; --rule-faint:#1D272E;
  --accent:#6FA6C6; --accent-soft:#17303F;
  --good:#63A583; --good-soft:#162A21;
  --bad:#CE7358; --bad-soft:#2E1B15;
  --warn:#C6A05B; --warn-soft:#2A2317;
}}
:root[data-theme="dark"]{
  --ground:#0E1418; --surface:#151D22; --sunk:#111920;
  --ink:#DDE4E7; --ink-soft:#A9B5BB; --muted:#78868D;
  --rule:#26323A; --rule-faint:#1D272E;
  --accent:#6FA6C6; --accent-soft:#17303F;
  --good:#63A583; --good-soft:#162A21;
  --bad:#CE7358; --bad-soft:#2E1B15;
  --warn:#C6A05B; --warn-soft:#2A2317;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);
     font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.shell{max-width:1020px;margin:0 auto;padding:0 20px 80px}

.layout{max-width:1200px;margin:0 auto;padding:0 20px 80px;display:flex;gap:28px;align-items:flex-start}
.main{flex:1;min-width:0}
.sidebar{flex:0 0 168px;width:168px;position:sticky;top:20px;display:flex;
         flex-direction:column;gap:1px;max-height:calc(100vh - 40px);overflow-y:auto;
         padding-top:26px}
.side-link{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:2px;
           font-family:var(--font-num);font-size:13.5px;color:var(--ink-soft);
           text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.side-link:hover{background:var(--sunk);color:var(--ink)}
a.side-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.side-link.disabled{color:var(--muted);opacity:.55;cursor:default}
.side-heading{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
              padding:12px 9px 3px;white-space:nowrap}
.side-heading:first-child{padding-top:0}
.dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dot.actionable{background:var(--good)}
.dot.event{background:var(--warn)}
.dot.failed{background:var(--bad)}
@media (max-width:760px){
  .layout{flex-direction:column;gap:6px;padding-bottom:60px}
  .sidebar{position:static;width:100%;flex:none;flex-direction:row;overflow-x:auto;
           overflow-y:visible;max-height:none;padding-top:14px;padding-bottom:10px;
           border-bottom:1px solid var(--rule-faint)}
  .side-link{flex:0 0 auto}
  .side-heading{flex:0 0 auto;padding:8px 6px 0 14px;align-self:center}
  .side-heading:first-child{padding-left:9px}
}

.masthead{background:var(--surface);border-bottom:1px solid var(--rule)}
.masthead .shell{padding-top:22px;padding-bottom:18px;display:flex;flex-wrap:wrap;
                 align-items:baseline;gap:8px 18px}
.wordmark{font-family:var(--font-num);font-size:21px;font-weight:600;letter-spacing:-.02em}
.vintage{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.spacer{flex:1 1 auto}
.weekly-link{font-size:13px;color:var(--accent);text-decoration:none}
.weekly-link:hover{text-decoration:underline}
.alert{padding:10px 0;font-weight:600;font-size:13.5px}
.alert.bad{background:var(--bad);color:var(--ground)}
.alert.warn{background:var(--warn);color:var(--ground)}
.alert .shell{padding-top:0;padding-bottom:0}

.groups{display:flex;flex-direction:column;gap:34px;padding-top:26px}
.group{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
   font-weight:600;display:flex;align-items:center;gap:10px}
h2 .n{font-family:var(--font-num);color:var(--ink-soft)}
h2::after{content:"";flex:1;height:1px;background:var(--rule-faint)}
.group.actionable h2{color:var(--good)}
.group.event h2{color:var(--warn)}
.group.failed h2{color:var(--bad)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
      padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.group.actionable .card{border-left:2px solid var(--good)}
.group.event .card{border-left:2px solid var(--warn)}
.group.failed .card{border-left:2px solid var(--bad)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.sym{font-family:var(--font-num);font-size:18px;font-weight:600;letter-spacing:-.01em}
.px{font-family:var(--font-num);font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-family:var(--font-num);font-size:13px;font-weight:500}
.chg.up{color:var(--good)} .chg.dn{color:var(--bad)}
.state{font-size:13px;color:var(--ink-soft)}
.detail-link{font-size:12.5px;color:var(--accent);text-decoration:none;white-space:nowrap;
             border-bottom:1px solid transparent}
.detail-link:hover{border-bottom-color:var(--accent)}
.detail-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.plan{background:var(--sunk);border-radius:2px;padding:10px 12px;display:flex;
      flex-direction:column;gap:5px}
.plan-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.plan-name{font-size:13.5px;font-weight:600}
.plan.brooks{border-left:2px solid var(--warn)}
.legs{font-family:var(--font-num);font-size:13px;color:var(--ink-soft)}
.rr{font-family:var(--font-num);font-size:13px;font-weight:600;color:var(--good)}
.size{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}
.trigger{font-size:12.5px;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--bad)}

.levels{display:flex;flex-wrap:wrap;gap:4px 6px;font-family:var(--font-num);font-size:11.5px}
.lvl{border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.lvl.s{border-color:color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.lvl.r{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.lvl.o{border-style:dashed;color:var(--muted)}
.chip{font-family:var(--font-num);font-size:11px;padding:1px 7px;border-radius:2px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.quiet-line{font-size:13px;color:var(--muted);font-family:var(--font-num)}

footer{border-top:1px solid var(--rule-faint);margin-top:44px;padding-top:16px;
       font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
footer a{color:var(--accent)}
</style>
</head>

  "⚠ 部分标的抓取失败，本页使用缓存数据，不是最新收盘。确认网络后重新运行。");
if (D.any_too_old) banner("bad",
  `⚠ 部分标的的最后一根 bar 已超过 ${D.max_age_sessions} 个交易日：抓取虽然成功，` +
  "但数据源可能返回了旧响应，或该标的已停牌。逐行看「数据陈旧」标记。");
if (D.any_failed) banner("bad", "⚠ 有标的完全失败，见页面底部「抓取失败」分组。");
{
  const reg = Object.entries(D.regimes || {});
  const off = reg.filter(([, g]) => g.state === "range" || g.state === "down");
  if (off.length) banner("warn",
    "大盘状态：" + reg.map(([b, g]) => `${b} ${g.label}`).join(" · ") +
    " — 基准不在「向上」状态的标的不开新仓（" +
    off.map(([b, g]) => `${b}：${g.reason}`).join("；") + "）");
}

const groups = document.getElementById("groups");
for (const key of ["actionable", "event", "quiet", "failed"]) {
  const rows = D.rows.filter(r => r.group === key);
  if (!rows.length) continue;
  const g = h("div", `group ${key}`);
  const title = h("h2");
  title.appendChild(document.createTextNode(L.group[key]));
  title.appendChild(h("span", "n", String(rows.length)));
  g.appendChild(title);
  rows.forEach(r => g.appendChild(card(r, key)));
  groups.appendChild(g);
}
if (!D.rows.length) groups.appendChild(h("div", "quiet-line", "关注列表为空"));

const sidebar = document.getElementById("sidebar");
const sectorOrder = D.sector_order || [];
const bySector = new Map();
D.rows.forEach(r => {
  const key = r.sector || "其他";
  if (!bySector.has(key)) bySector.set(key, []);
  bySector.get(key).push(r);
});
const sectors = [...bySector.keys()].sort((a, b) => {
  const ia = sectorOrder.indexOf(a), ib = sectorOrder.indexOf(b);
  return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
});
sectors.forEach(sector => {
  sidebar.appendChild(h("div", "side-heading", sector));
  bySector.get(sector).forEach(r => {
    const link = r.detail_page
      ? Object.assign(document.createElement("a"), { href: r.detail_page })
      : document.createElement("span");
    link.className = `side-link ${r.group}` + (r.detail_page ? "" : " disabled");
    link.title = r.detail_page ? `${r.symbol} 技术地图` : (r.error || "无详情页");
    link.appendChild(h("span", `dot ${r.group}`));
    link.appendChild(document.createTextNode(r.display || r.symbol));
    sidebar.appendChild(link);
  });
});

function card(r, key) {
  const c = h("div", "card");
  const top = h("div", "top");
  top.appendChild(h("span", "sym", r.symbol));
  if (r.price != null) top.appendChild(h("span", "px", fmt(r.price)));
  if (r.change_pct != null)
    top.appendChild(h("span", `chg ${r.change_pct >= 0 ? "up" : "dn"}`,
      `${r.change_pct >= 0 ? "+" : ""}${r.change_pct}%`));
  if (key !== "failed") {
    top.appendChild(h("span", "state",
      `${L.phase[r.phase] || r.phase} · ${L.zone[r.zone] || r.zone}` +
      ` · 日线 ${L.stack[r.daily_stack] || "—"}/4H ${L.stack[r.intraday_stack] || "—"}` +
      (r.benchmark ? ` · 基准 ${r.benchmark} ${L.stack[r.benchmark_stack] || "—"}` +
        (r.regime ? ` · 大盘${r.regime.label}` : "") : "") +
      (r.brooks ? ` · Brooks ${r.brooks.summary}` : "")));
  }
  if (r.price_is_live) top.appendChild(h("span", "chip warn", "盘中"));
  if (r.stale) top.appendChild(h("span", "chip bad", "回退缓存"));
  if (r.too_old) top.appendChild(h("span", "chip bad", `数据陈旧 ${r.age_sessions} 日`));
  if (r.unreliable_emas && r.unreliable_emas.length)
    top.appendChild(h("span", "chip warn", "warmup 不足"));
  top.appendChild(h("span", "spacer"));
  if (r.detail_page) {
    const a = document.createElement("a");
    a.className = "detail-link"; a.href = r.detail_page; a.textContent = "技术地图 →";
    top.appendChild(a);
  }
  c.appendChild(top);

  if (key === "failed") {
    c.appendChild(h("div", "warnline", r.error || "未知错误"));
    return c;
  }
  if (r.regime && (r.regime.state === "range" || r.regime.state === "down"))
    c.appendChild(h("div", "warnline",
      `⚠ 大盘状态：${r.benchmark} ${r.regime.label}（${r.regime.reason}）— 全部新仓计划已阻断`));
  if (r.event_mode) c.appendChild(h("div", "warnline",
    `⚠ 事件模式：${r.event_reason || "窗口内有未定价事件"} — 全部新仓计划已阻断`));

  // 只在"有可执行计划"那一组展开计划块；其余分组压缩成一行，
  // 否则十一个标的会把"今天没什么可做"这件事淹掉
  if (key === "actionable")
    (r.plans || []).filter(p => p.executable).forEach(p => c.appendChild(planBlock(p)));

  // Brooks 计划单独展示，不影响分组：在回测验证之前它只是参考
  if (key !== "failed" && r.brooks && r.brooks.plan.executable)
    c.appendChild(planBlock(r.brooks.plan, "brooks"));

  if (key !== "actionable") {
    const best = r.best_rr != null ? `最佳收益风险比 ${r.best_rr}` : "无可计算的计划";
    c.appendChild(h("div", "quiet-line", best +
      (r.earnings ? ` · 下次财报 ${r.earnings}` : "")));
  }

  const lv = h("div", "levels");
  if (r.ladder && r.ladder.length) {
    // 后端已按价格从高到低排好：关键位之间穿插整数关口（虚线框，只作参考）
    r.ladder.forEach(x => {
      if (x.kind === "round")
        lv.appendChild(Object.assign(h("span", "lvl o", x.text),
          { title: `${x.label}关口（心理参考，不入计划）` }));
      else
        lv.appendChild(h("span", x.kind === "support" ? "lvl s" : "lvl r",
          `${x.label} ${x.text} ${x.hits}/8`));
    });
  } else {
    (r.resistances || []).slice().reverse().forEach(x =>
      lv.appendChild(h("span", "lvl r", `${x.label} ${x.text || fmt(x.display, 0)} ${x.hits}/8`)));
    (r.supports || []).forEach(x =>
      lv.appendChild(h("span", "lvl s", `${x.label} ${x.text || fmt(x.display, 0)} ${x.hits}/8`)));
  }
  if (lv.children.length) c.appendChild(lv);
  return c;
}

function planBlock(p, kind) {
  const b = h("div", kind === "brooks" ? "plan brooks" : "plan");
  const t = h("div", "plan-top");
  t.appendChild(h("span", "plan-name", p.title + (p.validated === false ? "（未经回测验证）" : "")));
  t.appendChild(h("span", "legs",
    `入 ${fmt(p.entry, 2)} / 损 ${fmt(p.stop, 2)} / T1 ${fmt(p.t1, 2)}` +
    (p.entry_level ? `  (${p.entry_level})` : "")));
  t.appendChild(h("span", "rr", `R:R（盈亏比）${p.rr}`));
  if (p.quantity != null)
    t.appendChild(h("span", "size", `${p.quantity} 股 · 名义 ${fmt(p.notional, 0)}`));
  b.appendChild(t);
  if (p.trigger) b.appendChild(h("div", "trigger", `触发：${p.trigger}`));
  if (p.equation) b.appendChild(h("div", "trigger", `交易者方程式：${p.equation}`));
  if (p.sizing_warning) b.appendChild(h("div", "warnline", `⚠ ${p.sizing_warning}`));
  return b;
}

document.getElementById("foot-note").textContent =
  `关注 ${D.rows.length} 个标的` +
  (D.account ? ` · 仓位按账户 ${fmt(D.account, 0)}、单笔风险 ${(D.risk_pct * 100).toFixed(2)}% 反推` : "") +
  ` · 有计划 ${D.counts.actionable} · 事件 ${D.counts.event} · 无计划 ${D.counts.quiet}` +
  ` · Brooks 可执行 ${D.brooks_executable || 0}` +
  (D.counts.failed ? ` · 失败 ${D.counts.failed}` : "");
</script>
</body>
</html>
