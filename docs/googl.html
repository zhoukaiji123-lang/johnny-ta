* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);

  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;

}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; display: flex; flex-direction: column; gap: 28px; }

/* ---- 状态条 ---- */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  position: sticky; top: 0; z-index: 20;
}
.masthead-inner {
  max-width: 1180px; margin: 0 auto; padding: 14px 24px;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
}
.ticker { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.price { font-family: var(--font-num); font-size: 26px; font-weight: 500; letter-spacing: -.02em; }
.price-meta { font-size: 12.5px; color: var(--muted); }
.masthead-spacer { flex: 1 1 auto; }
.chip {
  font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 9px; border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-soft);
  white-space: nowrap;
}
.chip-live { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.chip-zone { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* ---- 数据口径条：图纸的图签栏 ---- */
.colophon {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border: 1px solid var(--rule); background: var(--surface); border-radius: 3px;
  overflow: hidden; margin-top: 24px;
}
.colophon div { padding: 10px 14px; border-right: 1px solid var(--rule-faint); }
.colophon div:last-child { border-right: 0; }
.colophon dt { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 3px; }
.colophon dd { margin: 0; font-family: var(--font-num); font-size: 13px; }

/* ---- 通用块 ---- */
section { display: flex; flex-direction: column; gap: 14px; }
h2 {
  font-size: 12px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted);
  margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px;
}
h2::after { content: ""; flex: 1; height: 1px; background: var(--rule-faint); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; }

/* ---- 图层控制 ---- */
.layers { display: flex; flex-wrap: wrap; gap: 6px; }
.layers button {
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 500;
  padding: 5px 11px; border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink-soft); border-radius: 2px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.layers button:hover { border-color: var(--accent); color: var(--ink); }
.layers button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.swatch { width: 10px; height: 2px; border-radius: 1px; background: currentColor; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 图 ---- */
/* 容器比图窄时横向滚动，而不是让整张图（含所有文字）一起缩小到看不清——
   字号跟着 viewBox 整体缩放是 SVG 的天生行为，锁最小宽度是最小代价的解法 */
.chart-frame { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
              overflow-x: auto; }
.chart-frame svg { display: block; width: 100%; height: auto; }
#chart-daily { min-width: 1000px; }
#chart-intraday { min-width: 500px; }
.readout {
  position: absolute; top: 10px; left: 12px; pointer-events: none;
  font-family: var(--font-num); font-size: 12px; color: var(--ink-soft);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  padding: 4px 8px; border: 1px solid var(--rule-faint); border-radius: 2px;
  display: flex; gap: 12px; opacity: 0; transition: opacity .12s;
}
.readout.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .readout { transition: none; } }

/* ---- 当前位置刻度 ---- */
.ladder {
  display: flex; align-items: flex-start; gap: 2px; padding: 10px 2px 16px;
  border-bottom: 1px solid var(--rule-faint); margin-bottom: 14px; overflow-x: auto;
}
.ladder-cell {
  flex: 1 1 0; min-width: 46px; display: flex; flex-direction: column; align-items: center;
  gap: 5px; position: relative; padding-top: 9px;
}
.ladder-cell::before {
  content: ""; position: absolute; top: 3px; left: 0; right: 0; height: 1px; background: var(--rule);
}
.ladder-cell:first-child::before { left: 50%; }
.ladder-cell:last-child::before { right: 50%; }
.ladder-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); z-index: 1; }
.ladder-s .ladder-dot { background: var(--support); }
.ladder-r .ladder-dot { background: var(--resist); }
.ladder-now .ladder-dot { width: 9px; height: 9px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ladder-label { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.ladder-now .ladder-label { color: var(--accent); }
.ladder-value {
  font-family: var(--font-num); font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--ink-soft);
}
.ladder-s .ladder-value { color: var(--support); }
.ladder-r .ladder-value { color: var(--resist); }
.ladder-now .ladder-value { color: var(--accent); font-size: 13px; }

.levels { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {

td { padding: 9px 12px; border-bottom: 1px solid var(--rule-faint); vertical-align: top; }

.tag { font-family: var(--font-num); font-weight: 600; font-size: 12.5px; }

.role { font-size: 12.5px; color: var(--ink-soft); }
.ev { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.ev span {

  border: 1px solid var(--rule); border-radius: 2px; color: var(--muted);
}
.rule-line { font-size: 12px; color: var(--ink-soft); line-height: 1.45; }
.rule-line b { font-weight: 600; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }

/* ---- 计划 ---- */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.plan {

}
.plan:hover { border-color: var(--accent); }

.plan-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.plan-title { font-size: 14.5px; font-weight: 600; }
.verdict { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
.verdict.ok { color: var(--support); background: var(--support-soft); }

.legs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule-faint); border: 1px solid var(--rule-faint); border-radius: 2px; }

document.getElementById("m-zone").textContent = ZONE[A.position_zone] || A.position_zone;
if (A.price_is_live) {
  const c = document.getElementById("m-live");
  c.hidden = false;
  c.textContent = `盘中 · 结构截至 ${A.structure_as_of.slice(0, 10)} 收盘`;
}
// 数据可能以两种方式变旧，必须分别检测：
//   stale   —— 抓取失败、回退到了缓存
//   too_old —— 抓取成功了，但返回的最后一根 bar 本身就很旧
// 只查前者会漏掉数据源故障返回旧响应、以及标的停牌的情形。
(function () {
  const h = A.data_health || {};
  const msgs = [];
  if (h.stale)
    msgs.push(`抓取失败，本页使用 ${A.data.daily.fetched_at.replace("T", " ").slice(0, 16)} UTC 的缓存`);
  if (h.too_old)
    msgs.push(`最后一根 bar 距今 ${h.age_sessions} 个交易日（阈值 ${h.max_age_sessions}），可能是数据源旧响应或标的停牌`);
  if (!msgs.length) return;
  const bar = document.createElement("div");
  bar.style.cssText =
    "background:var(--resist);color:var(--ground);padding:9px 24px;font-size:13.5px;font-weight:600;";
  const inner = document.createElement("div");
  inner.style.cssText = "max-width:1180px;margin:0 auto";
  inner.textContent = "⚠ 数据不可信：" + msgs.join("；") + "。请确认网络后重新运行 jta chart。";
  bar.appendChild(inner);
  document.querySelector("header.masthead").after(bar);
})();
document.getElementById("foot-gen").textContent =
  `数据抓取于 ${A.data.daily.fetched_at.replace("T", " ").slice(0, 19)} UTC · schema ${A.schema_version}`;
document.getElementById("disclaimer").innerHTML =
  "<strong>关于这张图能回答什么。</strong>" + A.validation_disclaimer;
</script>
<script>
/* ---------- 日线图 ---------- */
const D = C.daily, bars = D.bars;
// 右侧留出独立的关键位标签栏（LEVEL_COL_W）+ 坐标轴数字栏（AXIS_COL_W），
// 二者都在蜡烛图绘制区之外，标签不会再跟最近几十根 K 线的影线叠在一起
const LEVEL_COL_W = 128, AXIS_COL_W = 46, COL_GAP = 8;
const W = 1120, H = 560, PAD = { l: 14, r: 6 + LEVEL_COL_W + COL_GAP + AXIS_COL_W + 6, t: 18, b: 100 };
const PRICE_H = 384, VOL_TOP = 416, VOL_H = 70;
const plotW = W - PAD.l - PAD.r;
const bw = plotW / bars.length;

let lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h));
const padY = (hi - lo) * 0.06; lo -= padY; hi += padY;
const y = p => PAD.t + (hi - p) / (hi - lo) * PRICE_H;
const x = i => PAD.l + i * bw + bw / 2;
const maxVol = Math.max(...bars.map(b => b.v));
const vy = v => VOL_TOP + VOL_H - (v / maxVol) * VOL_H;
const inRange = p => p >= lo && p <= hi;

const svg = document.getElementById("chart-daily");
const layerOrder = ["grid","fib","ema","vegas","trend","candles","vol","swing","levels","td","plan","now","axis"];
const L = {};
svg.appendChild(el("defs", {}, [
  el("clipPath", { id: "clip-price" }, [
    el("rect", { x: PAD.l, y: PAD.t, width: plotW, height: PRICE_H })])
]));
layerOrder.forEach(k => { L[k] = el("g", { "data-layer": k }); svg.appendChild(L[k]); });
["fib","ema","vegas","trend","levels","plan"].forEach(k => L[k].setAttribute("clip-path", "url(#clip-price)"));

/* 网格与坐标：坐标轴数字栏在关键位标签栏right侧，二者互不重叠 */
const axisX = W - PAD.r + LEVEL_COL_W + COL_GAP + 6;
const ticks = 6;
for (let i = 0; i <= ticks; i++) {
  const p = lo + (hi - lo) * i / ticks, yy = y(p);
  L.grid.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: yy, y2: yy, class: "s-grid", "stroke-width": 1 }));
  L.axis.appendChild(el("text", { x: axisX, y: yy + 4, class: "s-tx-muted",
    "font-size": 11, "font-family": "var(--font-num)", text: fmt(p, 0) }));
}
L.axis.appendChild(el("text", { x: axisX, y: VOL_TOP + 10, class: "s-tx-muted",
  "font-size": 10, "font-family": "var(--font-num)", text: "VOL" }));
const step = Math.ceil(bars.length / 9);
bars.forEach((b, i) => {
  if (i % step) return;
  L.grid.appendChild(el("line", { x1: x(i), x2: x(i), y1: PAD.t, y2: PAD.t + PRICE_H, class: "s-grid", "stroke-width": 1 }));
  L.axis.appendChild(el("text", { x: x(i), y: VOL_TOP + VOL_H + 22, class: "s-tx-muted",
    "font-size": 10.5, "font-family": "var(--font-num)", "text-anchor": "middle", text: b.t.slice(2, 10) }));
});

/* K 线与成交量 */
bars.forEach((b, i) => {
  const cls = b.c >= b.o ? "s-up" : "s-dn";
  L.candles.appendChild(el("line", { x1: x(i), x2: x(i), y1: y(b.h), y2: y(b.l), class: cls, "stroke-width": 1 }));
  const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
  L.candles.appendChild(el("rect", { x: x(i) - Math.max(bw * .32, .6), y: top,
    width: Math.max(bw * .64, 1.2), height: Math.max(bot - top, .8), class: cls }));
  L.vol.appendChild(el("rect", { x: x(i) - Math.max(bw * .32, .6), y: vy(b.v),
    width: Math.max(bw * .64, 1.2), height: VOL_TOP + VOL_H - vy(b.v), class: cls, opacity: .32 }));
});

/* EMA / Vegas */
const emaStyle = { ema8: ["s-ln-accent", 1.4], ema13: ["s-ln-muted", 1.2], ema21: ["s-ln-soft", 1.2] };
const drawLine = (vals, cls, sw, dash, layer) => {
  const pts = [];
  vals.forEach((v, i) => { if (v != null && inRange(v)) pts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); });
  if (pts.length > 1) layer.appendChild(el("polyline", { points: pts.join(" "),
    class: `${cls} s-fill-none`, "stroke-width": sw, "stroke-dasharray": dash }));
};
Object.entries(emaStyle).forEach(([k, [c, w]]) => drawLine(D.ema[k], c, w, null, L.ema));
["ema144", "ema169"].forEach(k => drawLine(D.ema[k], "s-ln-warn", 1.3, "5 3", L.vegas));

/* Fib 图层：参考线全画，但文字标签只留离现价最近的一批。
   最多 3 组 Fib × 7 个比例 ≈ 21 条，价格挨得近的话文字会直接叠死——
   与其把 21 条硬挤开变成一列几乎贴在一起的小字，不如只标最相关的几条，
   其余的线仍然画出来，读者看得到路径，只是不是每一条都标数字。 */
const FIB_MAX_LABELS = 8, FIB_GAP = 24, FIB_BOX_W = 100, FIB_BOX_H = 16;
const fibLabels = [];
C.fibs.forEach((f, fi) => {
  const dash = fi === 2 ? "2 4" : (fi === 1 ? "6 4" : null);
  const lc = fi === 2 ? "s-ln-muted" : "s-ln-accent";
  const tc = fi === 2 ? "s-tx-muted" : "s-tx-accent";
  f.levels.forEach(lv => {
    if (!inRange(lv.price)) return;
    L.fib.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: y(lv.price), y2: y(lv.price),
      class: lc, "stroke-width": .9, "stroke-dasharray": dash, opacity: .5 }));
    fibLabels.push({ y: y(lv.price), tc, dist: Math.abs(lv.price - A.current_price),
      text: `${lv.ratio.toFixed(3)} · ${fmt(lv.price, 0)}` });
  });
});
const shownFib = fibLabels.sort((a, b) => a.dist - b.dist).slice(0, FIB_MAX_LABELS)
  .sort((a, b) => a.y - b.y);
shownFib.forEach((l, i) => {
  l.ly = l.y;
  if (i > 0) l.ly = Math.max(l.ly, shownFib[i - 1].ly + FIB_GAP);
});
const fibOverflow = shownFib.length ? shownFib[shownFib.length - 1].ly - (PAD.t + PRICE_H) : 0;
if (fibOverflow > 0) shownFib.forEach(l => { l.ly -= fibOverflow; });
const fibBoxX = PAD.l + 4;
shownFib.forEach(l => {
  const g = el("g", {});
  if (Math.abs(l.ly - l.y) > 1)
    g.appendChild(el("line", { x1: fibBoxX - 2, y1: l.y, x2: fibBoxX - 2, y2: l.ly,
      class: l.tc, "stroke-width": 1, opacity: .4 }));
  g.appendChild(el("rect", { x: fibBoxX - 4, y: l.ly - FIB_BOX_H / 2, width: FIB_BOX_W, height: FIB_BOX_H,
    class: "s-fill-accent", opacity: .16, rx: 2 }));
  g.appendChild(el("text", { x: fibBoxX, y: l.ly + 4, class: l.tc,
    "font-size": 10, "font-family": "var(--font-num)", text: l.text }));
  L.fib.appendChild(g);
});
if (fibLabels.length > shownFib.length)
  L.fib.appendChild(el("text", { x: fibBoxX, y: PAD.t + PRICE_H + 12, class: "s-tx-muted",
    "font-size": 9.5, "font-family": "var(--font-num)",
    text: `仅标最近 ${shownFib.length}/${fibLabels.length} 条，其余参考线仍画在图上` }));

/* 趋势线：按锚点与斜率外推到右缘 */
const barIndexByTs = new Map(bars.map((b, i) => [b.t.slice(0, 10), i]));
const trendLabels = [];
D.trendlines.forEach(t => {
  const i0 = barIndexByTs.get(t.from.t.slice(0, 10));
  if (i0 === undefined) return;
  const i1 = bars.length - 1;
  const p1 = t.from.price + t.slope_per_bar * (i1 - i0);
  L.trend.appendChild(el("line", { x1: x(i0), y1: y(t.from.price), x2: x(i1), y2: y(p1),
    class: t.kind === "up" ? "s-ln-sup" : "s-ln-res", "stroke-width": 1.2,
    "stroke-dasharray": t.broken_at ? "3 3" : null, opacity: .8 }));
  // 标签放线的中段而不是右端：右端是关键位标签区，两套标签会互相压死
  const im = i0 + (i1 - i0) * 0.72, pm = t.from.price + t.slope_per_bar * (im - i0);
  if (inRange(pm)) trendLabels.push({ x: x(im), y: y(pm), sup: t.kind === "up",
    text: `趋势线 约 ${fmt(t.current, 0)}` });
});
// 通常只有 1-2 条，横向挨得近才需要互相避让
trendLabels.sort((a, b) => a.y - b.y).forEach((l, i) => {
  l.ly = l.y;
  if (i > 0 && Math.abs(l.x - trendLabels[i - 1].x) < 90) l.ly = Math.max(l.ly, trendLabels[i - 1].ly + 22);
});
trendLabels.forEach(l => {
  const w = 96;
  L.trend.appendChild(el("rect", { x: l.x - w / 2, y: l.ly - 17, width: w, height: 15,
    class: l.sup ? "s-fill-sup" : "s-fill-res", opacity: .18, rx: 2 }));
  L.trend.appendChild(el("text", { x: l.x, y: l.ly - 6, "text-anchor": "middle",
    class: l.sup ? "s-tx-sup" : "s-tx-res", "font-size": 10,
    "font-family": "var(--font-num)", text: l.text }));
});

/* 摆动点 */
D.swings.forEach(s => {
  const i = barIndexByTs.get(s.t.slice(0, 10));
  if (i === undefined || !inRange(s.price)) return;
  L.swing.appendChild(el("circle", { cx: x(i), cy: y(s.price), r: s.base ? 3 : 2,
    class: `s-ln-accent ${s.base ? "s-fill-accent" : "s-fill-none"}`, "stroke-width": 1, opacity: .75 }));
});

/* TD9 */
D.td.forEach(m => {
  const i = barIndexByTs.get(m.t.slice(0, 10));
  if (i === undefined) return;
  const b = bars[i], up = m.kind === "sell";
  L.td.appendChild(el("text", { x: x(i), y: up ? y(b.h) - 8 : y(b.l) + 15, "text-anchor": "middle",
    class: up ? "s-tx-res" : "s-tx-sup", "font-size": 11, "font-weight": 600,
    "font-family": "var(--font-num)", text: m.perfected ? "9✓" : "9" }));
});

/* 关键位与现价：右侧标签统一避让，否则挤在一起会互相盖死 */
const levelNodes = new Map();
const allLevels = [...A.supports.map(l => ({ ...l, side: "support" })),
                   ...A.resistances.map(l => ({ ...l, side: "resistance" }))];

const labels = [];
allLevels.forEach(lv => {
  const p = lv.display ?? lv.raw_price;
  if (!inRange(p)) return;
  // display_text 是后端算好的展示串（含"约"前缀、含区间"217–217.5"这种格式）；
  // 前端不再自己用 fmt() 重新拼一遍，不然区间信息传不到图上
  labels.push({ price: p, y: y(p), kind: lv.side, lv, text: `${lv.label} ${lv.display_text}` });
});
if (inRange(A.current_price))
  labels.push({ price: A.current_price, y: y(A.current_price), kind: "now", text: fmt(A.current_price, 0) });

// 自上而下推开：相邻标签留够 GAP，且必须明显大于标签背景框高度（18px），
// 否则相邻两个框只隔 1px，视觉上会连成一整条、看不清是几个数字粘在一起
labels.sort((a, b) => a.y - b.y);
const GAP = 27;
const BOX_W = 128, BOX_H = 18;
labels.forEach((l, i) => {
  l.ly = l.y;
  if (i > 0) l.ly = Math.max(l.ly, labels[i - 1].ly + GAP);
});
const overflow = labels.length ? labels[labels.length - 1].ly - (PAD.t + PRICE_H) : 0;
if (overflow > 0) labels.forEach(l => { l.ly -= overflow; });

// 标签栏整体挪到蜡烛图绘制区右侧的独立留白里（W - PAD.r 之外），
// 不再跟最近的 K 线影线叠在一起挡字；现价也并进同一栏、同一套避让逻辑，
// 不再用旧的窄小徽章挤在坐标轴数字缝里
const boxX = W - PAD.r + 6;
labels.forEach(l => {
  const now = l.kind === "now";
  const sup = l.kind === "support";
  const cls = now ? "ink" : (sup ? "sup" : "res");
  const g = el("g", {});
  g.appendChild(el("line", { x1: PAD.l, x2: boxX, y1: l.y, y2: l.y,
    class: `s-ln-${cls}`, "stroke-width": now ? 1 : 1.6, "stroke-dasharray": now ? "4 3" : null,
    opacity: now ? .55 : .9 }));
  // 引线：标签被推开时，把它连回真实价格位置
  g.appendChild(el("line", { x1: boxX, y1: l.y, x2: boxX + 4, y2: l.ly,
    class: `s-ln-${cls}`, "stroke-width": 1, opacity: .55 }));
  g.appendChild(el("rect", { x: boxX + 4, y: l.ly - BOX_H / 2, width: BOX_W, height: BOX_H,
    class: now ? "s-fill-ink" : (sup ? "s-fill-sup" : "s-fill-res"), opacity: now ? 1 : .16, rx: 2 }));
  g.appendChild(el("text", { x: boxX + 4 + BOX_W - 8, y: l.ly + 4, "text-anchor": "end",
    class: now ? "s-tx-ground" : (sup ? "s-tx-sup" : "s-tx-res"),
    "font-size": 11.5, "font-weight": 600, "font-family": "var(--font-num)", text: l.text }));
  (now ? L.now : L.levels).appendChild(g);
  if (!now) levelNodes.set(l.lv.label, g);
});
</script>
<script>
/* ---------- 图层开关 ---------- */
const LAYERS = [
  ["fib", "斐波那契", "var(--accent)"],
  ["ema", "EMA 8/13/21", "var(--accent)"],
  ["vegas", "Vegas 144/169", "var(--warn)"],
  ["trend", "趋势线", "var(--support)"],
  ["levels", "关键位", "var(--resist)"],
  ["swing", "摆动点", "var(--accent)"],
  ["td", "TD 九转", "var(--ink-soft)"],
  ["vol", "成交量", "var(--muted)"],
];
// Fib 三套共 34 条线，默认全开会盖掉 K 线本身；摆动点同理。
// 裸 K 优先是这套方法的第一条工具排序，默认视图应该体现这一点。
const OFF = new Set(["swing", "fib"]);
const layerBar = document.getElementById("layers");
LAYERS.forEach(([key, label, colour]) => {
  const on = !OFF.has(key);
  L[key].style.display = on ? "" : "none";
  const b = h("button", null);
  b.setAttribute("aria-pressed", String(on));
  b.appendChild(el("span", { class: "swatch", style: `background:${colour}` }));
  b.appendChild(document.createTextNode(label));
  b.onclick = () => {
    const next = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(next));
    L[key].style.display = next ? "" : "none";
  };
  layerBar.appendChild(b);
});

/* ---------- 读数 ---------- */
const readout = document.getElementById("readout");
svg.addEventListener("mousemove", ev => {
  const r = svg.getBoundingClientRect();
  const i = Math.round(((ev.clientX - r.left) / r.width * W - PAD.l - bw / 2) / bw);
  if (i < 0 || i >= bars.length) { readout.classList.remove("on"); return; }
  const b = bars[i];
  readout.textContent = "";
  [["", b.t.slice(0, 10)], ["O", fmt(b.o)], ["H", fmt(b.h)], ["L", fmt(b.l)], ["C", fmt(b.c)],
   ["V", (b.v / 1e6).toFixed(1) + "M"]].forEach(([k, v]) => {
    const s = h("span", null, k ? `${k} ${v}` : v);
    readout.appendChild(s);
  });
  readout.classList.add("on");
});
svg.addEventListener("mouseleave", () => readout.classList.remove("on"));

/* ---------- 4H 执行图 ---------- */
(function () {
  const bars2 = C.intraday.bars, s = document.getElementById("chart-intraday");
  const W2 = 560, H2 = 300, P2 = { l: 8, r: 52, t: 12, b: 26 };
  const pw = W2 - P2.l - P2.r, ph = H2 - P2.t - P2.b, bw2 = pw / bars2.length;
  let lo2 = Math.min(...bars2.map(b => b.l)), hi2 = Math.max(...bars2.map(b => b.h));
  const pad2 = (hi2 - lo2) * .06; lo2 -= pad2; hi2 += pad2;
  const y2 = p => P2.t + (hi2 - p) / (hi2 - lo2) * ph;
  const x2 = i => P2.l + i * bw2 + bw2 / 2;
  for (let i = 0; i <= 4; i++) {
    const p = lo2 + (hi2 - lo2) * i / 4;
    s.appendChild(el("line", { x1: P2.l, x2: W2 - P2.r, y1: y2(p), y2: y2(p), class: "s-grid" }));
    s.appendChild(el("text", { x: W2 - P2.r + 6, y: y2(p) + 4, class: "s-tx-muted",
      "font-size": 10, "font-family": "var(--font-num)", text: fmt(p, 0) }));
  }
  bars2.forEach((b, i) => {
    const cls2 = b.c >= b.o ? "s-up" : "s-dn";
    s.appendChild(el("line", { x1: x2(i), x2: x2(i), y1: y2(b.h), y2: y2(b.l), class: cls2, "stroke-width": .9 }));
    const t = y2(Math.max(b.o, b.c)), bo = y2(Math.min(b.o, b.c));
    s.appendChild(el("rect", { x: x2(i) - Math.max(bw2 * .3, .5), y: t,
      width: Math.max(bw2 * .6, 1), height: Math.max(bo - t, .8), class: cls2 }));
  });
  Object.entries({ ema8: "s-ln-accent", ema13: "s-ln-muted", ema21: "s-ln-soft" }).forEach(([k, c]) => {
    const pts = [];
    (C.intraday.ema[k] || []).forEach((v, i) => {
      if (v != null && v >= lo2 && v <= hi2) pts.push(`${x2(i).toFixed(1)},${y2(v).toFixed(1)}`);
    });
    if (pts.length > 1) s.appendChild(el("polyline", { points: pts.join(" "),
      class: `${c} s-fill-none`, "stroke-width": 1.1 }));
  });
  allLevels.forEach(lv => {
    const p = lv.display ?? lv.raw_price;
    if (p < lo2 || p > hi2) return;
    const sup2 = lv.side === "support";
    s.appendChild(el("line", { x1: P2.l, x2: W2 - P2.r, y1: y2(p), y2: y2(p),
      class: sup2 ? "s-ln-sup" : "s-ln-res", "stroke-width": 1.2, opacity: .8 }));
    s.appendChild(el("text", { x: P2.l + 3, y: y2(p) - 3, class: sup2 ? "s-tx-sup" : "s-tx-res", "font-size": 9.5,
      "font-weight": 600, "font-family": "var(--font-num)", text: lv.label }));
  });
  s.appendChild(el("text", { x: P2.l, y: H2 - 6, class: "s-tx-muted", "font-size": 10,
    "font-family": "var(--font-num)", text: `${bars2.length} 根 4H bar · ${bars2[0].t.slice(2, 10)} 起` }));
})();

/* ---------- 当前位置：关键位 + 现价 一条横向刻度 ---------- */
(() => {
  const ladder = document.getElementById("ladder");
  if (!ladder) return;
  // 从深到浅排到最左，现价插在最近支撑与最近压力之间，最右是最浅的压力
  const items = [
    ...[...A.supports].reverse().map(lv => ({ label: lv.label, text: lv.display_text, kind: "s" })),
    { label: "现价", text: fmt(A.current_price), kind: "now" },
    ...A.resistances.map(lv => ({ label: lv.label, text: lv.display_text, kind: "r" })),
  ];
  items.forEach(it => {
    const cell = h("div", `ladder-cell ladder-${it.kind}`);
    cell.appendChild(h("span", "ladder-dot"));
    cell.appendChild(h("span", "ladder-label", it.label));
    cell.appendChild(h("span", "ladder-value", it.text));
    ladder.appendChild(cell);
  });
})();

/* ---------- 关键位表 ---------- */
const tbody = document.getElementById("levels-body");
[...A.resistances].reverse().concat(A.supports).forEach(lv => {
  const isSup = lv.label.startsWith("S");
  const tr = h("tr");
  tr.appendChild(h("td", null)).appendChild(h("span", `tag ${isSup ? "tag-s" : "tag-r"}`, lv.label));
  const c2 = h("td");
  c2.appendChild(h("div", "lvl", lv.display_text));
  if (Math.abs((lv.display ?? 0) - lv.raw_price) > 1e-9)
    c2.appendChild(h("div", "raw", `原值 ${fmt(lv.raw_price)}`));
  c2.appendChild(h("div", "raw", `距现价 ${lv.distance_atr} ATR`));
  tr.appendChild(c2);
  const c3 = h("td");
  c3.appendChild(h("div", "role", lv.role_label));
  c3.appendChild(h("div", "raw", `${lv.scoring.hits}/8 类证据`));
  const ev = h("div", "ev");
  lv.evidence_families.forEach(f => ev.appendChild(h("span", null, EV[f] || f)));
  c3.appendChild(ev);
  tr.appendChild(c3);
  const c4 = h("td");
  const cf = h("div", "rule-line"); cf.appendChild(h("b", null, "确认 ")); cf.appendChild(document.createTextNode(lv.confirmation));
  const iv = h("div", "rule-line"); iv.appendChild(h("b", null, "失效 ")); iv.appendChild(document.createTextNode(lv.invalidation));
  c4.appendChild(cf); c4.appendChild(iv);
  if (lv.dynamic) c4.appendChild(h("div", "raw", "动态位 · 每根 bar 数值变化"));
  tr.appendChild(c4);
  tr.onmouseenter = () => { tr.classList.add("hot"); const g = levelNodes.get(lv.label); if (g) g.setAttribute("opacity", ".35"); };
  tr.onmouseleave = () => { tr.classList.remove("hot"); const g = levelNodes.get(lv.label); if (g) g.removeAttribute("opacity"); };
  tbody.appendChild(tr);
});
const sel = A.selection;
document.getElementById("selection-note").textContent =
  [sel.support.gap_note, sel.resistance.gap_note].filter(Boolean).join(" ") ||
  `内部计算了 ${sel.support.candidates_considered + sel.resistance.candidates_considered} 个候选位，` +
  `每侧按证据强度与最小间距筛出至多 3 档；未入选的候选不在图上画线。`;

/* ---------- 市场状态 ---------- */
const st = A.market_state, kv = document.getElementById("state-kv");
[["阶段", PHASE[st.phase] || st.phase],
 ["长期位置", VEGAS[st.long_term_vs_vegas]],
 ["日线 EMA", STACK[st.daily_ema_stack]],
 ["4H EMA", STACK[st.intraday_ema_stack]],
 ["日线结构", STRUCT[st.daily_structure]],
 ["4H 结构", STRUCT[st.intraday_structure]],
 ["TD 信号", A.td_signal ? `${A.td_signal.kind} @ ${A.td_signal.ts.slice(0, 10)}` : "近 3 根内无"],
].forEach(([k, v]) => {
  const row = h("div", "kv"); row.appendChild(h("span", null, k)); row.appendChild(h("span", null, v)); kv.appendChild(row);
});
</script>
<script>
/* ---------- 三套计划 ---------- */
const planBox = document.getElementById("plans");
let activePlan = null;
const planLayer = L.plan;

function drawPlan(p) {
  planLayer.textContent = "";
  if (!p) return;
  const marks = [["入场", p.entry, "accent", "6 0"], ["止损", p.stop, "res", "5 3"],
                 ["T1", p.t1, "sup", "5 3"], ["T2", p.t2, "sup", "2 4"]];
  marks.forEach(([label, price, tone, dash]) => {
    if (price == null || !inRange(price)) return;
    planLayer.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: y(price), y2: y(price),
      class: `s-ln-${tone}`, "stroke-width": 1.4, "stroke-dasharray": dash === "6 0" ? null : dash, opacity: .95 }));
    planLayer.appendChild(el("rect", { x: PAD.l + 2, y: y(price) - 9, width: 74, height: 18,
      class: `s-fill-${tone}`, rx: 2 }));
    planLayer.appendChild(el("text", { x: PAD.l + 6, y: y(price) + 4, class: "s-tx-ground",
      "font-size": 11, "font-weight": 600, "font-family": "var(--font-num)",
      text: `${label} ${fmt(price, 0)}` }));
  });
  // 条件情景箭头：入场 → T1，明确标注为情景而非预测
  if (p.entry != null && p.t1 != null && inRange(p.entry) && inRange(p.t1)) {
    // 放图中部：右侧 90px 是关键位标签带，箭头画过去会盖住档位数字
    const xs = PAD.l + plotW * 0.50, xe = PAD.l + plotW * 0.68;
    planLayer.appendChild(el("path", {
      d: `M ${xs} ${y(p.entry)} Q ${(xs + xe) / 2} ${(y(p.entry) + y(p.t1)) / 2 - 18} ${xe} ${y(p.t1)}`,
      class: "s-ln-sup s-fill-none", "stroke-width": 1.3, "stroke-dasharray": "4 3", opacity: .8 }));
    planLayer.appendChild(el("text", { x: (xs + xe) / 2, y: (y(p.entry) + y(p.t1)) / 2 - 24,
      "text-anchor": "middle", class: "s-tx-sup", "font-size": 10, text: "条件情景 · 非预测" }));
  }
}

A.plans.forEach(p => {
  const card = h("button", "plan");
  card.setAttribute("aria-pressed", "false");
  const head = h("div", "plan-head");
  head.appendChild(h("div", "plan-title", p.title));
  head.appendChild(h("span", `verdict ${p.executable ? "ok" : "no"}`, p.executable ? "可执行" : "不可执行"));
  card.appendChild(head);

  const legs = h("div", "legs");
  [["入场", p.entry], ["止损", p.stop], ["T1", p.t1], ["T2", p.t2]].forEach(([k, v]) => {
    const d = h("div", "leg");
    d.appendChild(h("dt", null, k));
    d.appendChild(h("dd", null, v == null ? "—" : fmt(v, 0)));
    legs.appendChild(d);
  });
  card.appendChild(legs);

  const rr = h("div", "plan-note");
  rr.textContent = `收益风险比 ${p.rr ?? "—"} · ${p.tranche_text}` +
    (p.sizing ? ` · ${p.sizing.quantity} 股（占账户 ${p.sizing.pct_of_account}%）` : "");
  card.appendChild(rr);
  if (p.entry_level) card.appendChild(h("div", "plan-note", `入场档位：${p.entry_level}`));
  card.appendChild(h("div", "plan-note", `触发：${p.trigger}`));
  card.appendChild(h("div", "plan-note", `止损依据：${p.stop_basis}`));
  if (p.entry_note) {
    const n = h("div", "plan-note");
    n.style.color = "var(--muted)";
    n.textContent = p.entry_note;
    card.appendChild(n);
  }
  (p.cautions || []).forEach(c => {
    const n = h("div", "plan-note");
    n.style.color = "var(--warn)";
    n.textContent = "⚠ " + c;
    card.appendChild(n);
  });
  if (p.sizing && p.sizing.warning) {
    const n = h("div", "plan-note");
    n.style.color = "var(--resist)";
    n.textContent = "⚠ " + p.sizing.warning;
    card.appendChild(n);
  }

  if (!p.executable) {
    const b = h("div", "blockers");
    p.blocked_by.forEach(x => b.appendChild(h("div", null, `· ${x}`)));
    card.appendChild(b);
  }
  const cancel = h("div", "cancel");
  cancel.appendChild(h("div", null, "取消条件"));
  p.cancel_if.forEach(x => cancel.appendChild(h("div", null, `· ${x}`)));
  card.appendChild(cancel);

  card.onclick = () => {
    const on = card.getAttribute("aria-pressed") !== "true";
    planBox.querySelectorAll(".plan").forEach(n => n.setAttribute("aria-pressed", "false"));
    card.setAttribute("aria-pressed", String(on));
    activePlan = on ? p : null;
    drawPlan(activePlan);
  };
  planBox.appendChild(card);
});

/* ---------- 持仓与仓位 ---------- */
const hb = document.getElementById("holder"), hp = A.holder_playbook;
function card(title, build) {
  const c = h("div", "card");
  c.appendChild(h("h3", null, title));
  build(c);
  hb.appendChild(c);
}
card("分批止盈", c => hp.take_profit.forEach(t => {
  if (t.at == null) return;
  const r = h("div", "kv");
  r.appendChild(h("span", null, `${t.label} ${t.action}`));
  r.appendChild(h("span", null, fmt(t.at, 0)));
  c.appendChild(r);
}));
card("保护位与破位处理", c => {
  const r = h("div", "kv");
  r.appendChild(h("span", null, "当前保护位"));
  r.appendChild(h("span", null, hp.protective_stop.at == null ? "—" : fmt(hp.protective_stop.at, 0)));
  c.appendChild(r);
  c.appendChild(h("div", "rule-line", hp.protective_stop.rule));
  const ul = h("ul", "list");
  hp.on_break.forEach(b => { if (b.level != null) ul.appendChild(h("li", null, b.action)); });
  c.appendChild(ul);
});
card("仓位反推", c => {
  const ps = A.position_sizing;
  c.appendChild(h("div", "rule-line", ps.formula));
  if (ps.account) {
    const r = h("div", "kv");
    r.appendChild(h("span", null, "账户 / 单笔风险"));
    r.appendChild(h("span", null, `${fmt(ps.account, 0)} / ${(ps.risk_pct * 100).toFixed(2)}%`));
    c.appendChild(r);
  }
  c.appendChild(h("div", "rule-line", ps.note));
  if (hp.position) {
    const p = hp.position, r = h("div", "kv");
    r.appendChild(h("span", null, `持仓成本 ${fmt(p.cost, 0)} × ${p.shares}`));
    r.appendChild(h("span", null, `${p.unrealised_pct > 0 ? "+" : ""}${p.unrealised_pct}%`));
    c.appendChild(r);
    c.appendChild(h("div", "rule-line", p.breakeven_vs_s1));
  }
});

/* ---------- 事件与缺口 ---------- */
const eb = document.getElementById("events"), E = A.events;
function ecard(title, build) { const c = h("div", "card"); c.appendChild(h("h3", null, title)); build(c); eb.appendChild(c); }
ecard(E.event_mode ? "事件模式 · 已降级" : "事件日程", c => {
  if (!E.available) { c.appendChild(h("div", "rule-line", E.reason)); return; }
  if (E.next_earnings) {
    const r = h("div", "kv");
    r.appendChild(h("span", null, `下次财报 · ${E.next_earnings.sessions_away} 个交易日后`));
    r.appendChild(h("span", null, E.next_earnings.date));
    c.appendChild(r);
  }
  if (E.ex_dividend) {
    const r = h("div", "kv");
    r.appendChild(h("span", null, "除息日")); r.appendChild(h("span", null, E.ex_dividend));
    c.appendChild(r);
  }
  if (E.note) c.appendChild(h("div", "rule-line", E.note));
  const m = E.historical_earnings_moves || [];
  if (m.length) {
    c.appendChild(h("div", "rule-line", "历史财报后次日跳空："));
    const ul = h("ul", "list");
    m.slice(0, 4).forEach(x => {
      const eps = x.eps_actual != null
        ? `EPS ${x.eps_actual}（预期 ${x.eps_estimate ?? "—"}` +
          (x.surprise_pct != null ? `，${x.surprise_pct >= 0 ? "+" : ""}${x.surprise_pct}%` : "") + `） · `
        : "";
      ul.appendChild(h("li", null,
        `${x.earnings_date} → ${eps}次日 ${x.move_pct > 0 ? "+" : ""}${x.move_pct}%（${x.move_atr ?? "—"} ATR）`));
    });
    c.appendChild(ul);
  }
});
ecard("数据缺口与未实现部分", c => {
  const ul = h("ul", "list");
  A.known_gaps.forEach(g => ul.appendChild(h("li", null, g)));
  c.appendChild(ul);
});
if (E.news && E.news.length) ecard("外部新闻标题", c => {
  c.appendChild(h("div", "rule-line", E.news_note));
  const box = h("div", "news");
  E.news.slice(0, 5).forEach(n => {
    const wrap = h("div");
    const a = h("a", null, n.title || "(无标题)");
    if (n.link) { a.href = n.link; a.target = "_blank"; a.rel = "noopener noreferrer"; }
    wrap.appendChild(a);
    wrap.appendChild(h("time", null, [n.publisher, (n.published || "").toString().slice(0, 10)].filter(Boolean).join(" · ")));
    box.appendChild(wrap);
  });
  c.appendChild(box);
});
</script>
</body>
</html>
